[package]
edition      = "2024"
name         = "game_of_life"
rust-version = "1.88"
version      = "0.1.0"
license      = "MIT"

[[bin]]
name = "display_test"
path = "./src/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32c6", "log-04", "unstable"] }


esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c6", "log-04"] }
log                    = "0.4.27"

critical-section = "1.2.0"
display-interface-spi = "0.5"
esp-println      = { version = "0.17.0", features = ["esp32c6", "log-04"] }
embedded-graphics = "0.8"
embedded-hal-bus = "0.3.0"
fugit = "0.5.0"
heapless = "0.9.3"
mipidsi = "0.10.0"

